<div class="heart back"> </div>
<style>
  .back{
    position: absolute;
    margin: auto;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    
    animation-name:heart;
    animation-duration: 4s;
    animation-iteration-count: infinite;

  }
  .heart {
    position: absolute;
    margin: auto;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background-color: pink;
    height: 50px;
    width: 50px;
    transform: rotate(-45deg);
    animation-name:heart;
    animation-duration: infinite;
    animation-iteration-count: infinite;
    
  }
  .heart::after {
    background-color: pink;
    content: "";
    border-radius: 50%;
    position: absolute;
    width: 50px;
    height: 50px;
    top: 0px;
    left: 25px;
  }
  .heart::before {
    content: "";
    background-color: pink;
    border-radius: 50%;
    position: absolute;
    width: 50px;
    height: 50px;
    top: -25px;
    left: 0px;
  }
    .heart::after, .heart::before {
        background-color: pink;
        position: absolute;
        content: "";
        animation-name:heart;
        animation-duration: infinite;
    }

   @keyframes heart{
  0%{
    background-color: pink;
  }
  20%{
    background-color: orangered;
  }
  40%{
    background-color: green;
}
    60%{
        background-color: blue;
  }
    80%{
        background-color: purple;
    }
    100%{
        background-color: red;
    }
  }
   @keyframes backdiv {
    50% {
      background: #ffe6f2;
    }
  }
</style>
